# Refresh seller catalog stock via GetSellerList (paginated) every 30 min.
# Live GetItem verify still runs on each catalog answer.
# Requires repo secret: CRON_SECRET
name: Catalog sync cron

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Sync catalog pages 1-20
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi
          set -e
          for page in 1 4 7 10 13 16 19; do
            echo "Sync page=$page"
            curl -sS -f --max-time 90 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "https://message-ai-web.vercel.app/api/cron/catalog-sync?page=${page}&pages=3" \
              || echo "page ${page} soft-fail"
            sleep 2
          done
